name: Weekly Magazine Newsletter Send

on:
  schedule:
    - cron: "0 8 * * 6"
  workflow_dispatch:

jobs:
  send-weekly-magazine-newsletter:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger LE BRIEF weekly magazine newsletter send
        run: |
          curl --fail --show-error --silent \
            "https://www.lebrief.energy/api/cron/newsletter-weekly-send"
